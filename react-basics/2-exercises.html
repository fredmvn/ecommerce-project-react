<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 2</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      // 2a. Create an <App> component that returns a paragraph with the text: "Hello, welcome to my website" inside. Then, render this <App>.

      /* 2b. Continuing from 2a, in the <App> component, add 2 buttons after the paragraph: "Login" and "Sign up"
        - Use a Fragment to group them together
        - Use () to write the JSX on multiple lines
      */

      /* Continuing from 2b, in the <App> component, add 2 text boxes above the buttons with the placeholders "Email" and "Password".
        - Lay out the text boxes on separate lines using <div>
        - Try adding the attribute type="password" to the password textbox. This will cover up the text as you type
        */

      /* Continuing from 2c, create a new component called LoginForm, and move the textboxes and buttons (all the login-related code) into this component. Then, inside <App>, use <LoginForm> to create textboxes and buttons.
       */

      function LoginForm() {
        return (
          <>
            <div>
              <input type="email" placeholder="Email" />
            </div>
            <div>
              <input type="password" placeholder="Password" />
            </div>
            <button>Login</button>
            <button>Sign up</button>
          </>
        );
      }

      function App() {
        return (
          <>
            <p>Hello, welcome to my website</p>
            <LoginForm />
          </>
        );
      }

      // --- CHALLENGE EXERCISES --- //

      // For the challenge exercises, see '2-exercises-challenge.html'
      root.render(<App />);
    </script>
  </body>
</html>
