<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // In React, the component name MUST start with a capital letter -> Pascal Case

      // Fragment syntax: <></>, let us group HTML Elements without using a div as wrapper, resulting in a cleaner way to group elements
      function ChatInput() {
        return (
          <>
            <input placeholder="Send a message to Chatbot" size="30" />
            <button>Send</button>
          </>
        );
      }
      function ChatMessage({ sender, message }) {
        return (
          <div>
            {sender === "robot" && (
              <img src="assets/images/robot.png" width="50" />
            )}
            {message}
            {sender === "user" && (
              <img src="assets/images/user.png" width="50" />
            )}
          </div>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessage message="hello chatbot" sender="user" />
            <ChatMessage message="Hello! How can I help you?" sender="robot" />
            <ChatMessage message="can you get me todays date?" sender="user" />
            <ChatMessage message="Today is January 1" sender="robot" />
          </>
        );
      }

      // Instead of putting {ChatInput()}, we can use the component syntax, which let us insert our component as an HTML Element: <ChatInput></ChatInput> or, if it is not going to have child elements (self-closing syntax): <ChatInput />

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);

      root.render(<App />);
    </script>
  </body>
</html>
