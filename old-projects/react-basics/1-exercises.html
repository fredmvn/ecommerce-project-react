<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
      const container = document.querySelector(".js-container");
      // 1a. Using React, display a button on the website with the text "Good job!" inside the button.
      // 1b.  Using React, display a paragraph with the text "My name is [NAME]" on the website (replace [NAME] with your name).
      const button = <button>Good job!</button>;
      const NAME = "Frederick";
      const paragraph = <p>My name is {NAME}</p>;

      const elem1 = (
        <div>
          {button}
          {paragraph}
        </div>
      );

      // 1c. Create the design on the right (cotton socks cost) and display it on the website using React.
      const elem2 = (
        <div>
          <p>Cotton socks</p>
          <p>Pricke: $10</p>
          <button>Add to Cart</button>
        </div>
      );

      // 1d. You buy 1 pack of socks for $10 and 2 T-shirts for $8 each. Using JavaScript, calculate the total cost of this order, save it in a variable named `productCost`, and display it in the console.
      const productCost = 10 + 8 * 2;
      console.log(productCost);
      // 1e. Continuing from 1d, insert the productCost variable into a paragraph element, create the design below and display it on the website.
      const productCostElem = <p>Product cost: ${productCost}</p>;

      // --- CHALLENGE EXERCISES --- //

      // 1f. Continuing from 1e, let's pretend the shipping cost is $5. Save this in a variable named shippingCost, calculate the total cost using JavaScript (productCost + shippingCost), and display the results on the website using the design below:
      const shippingCost = 5;
      const shippingCostElem = <p>Shipping cost: ${shippingCost}</p>;
      const elem3 = (
        <div>
          {productCostElem}
          {shippingCostElem}
          <p>Total cost: ${productCost + shippingCost}</p>
          <button>Place your order</button>
        </div>
      );

      /* 1g. We're going to load the DayJS external library on the website (DayJS is an external library that helps us work with dates easier).
      - To load DayJS, create a <script> above your code, and load the URL: https://unpkg.com/supersimpledev/dayjs.js
      - After DayJS is loaded, use the code: dayjs().format('MMMM D') to get the current date. Display this result in the console (August 28).
      */
      const today = dayjs().format("MMMM D");
      console.log(today);
      // 1h. Continuing from 1g, insert the date in a paragrapg element, and display it on the website in this format: "Today is ${date}"
      const todayElem = <p>Today is {today}</p>;
      // 1i. Using DayJS, get the current time using dayjs().format('HH:mm:ss') and display it on the website in this format: "Current time: ${time}"
      const currentTime = dayjs().format("HH:mm:ss");
      const currentTimeElem = <p>Current time: {currentTime}</p>;
      /* 1j. We'll create a clock. Continue from exercise li and do these steps:
      - First, instead of doing ReactDOM.createRoot(...).render(...); save the root in a variable const root = ReactDOM.createRoot(...);
      and then do root.render(...)
      - Use the JavaScript code: setInterval(() => { ... }, 1000);
      (replace with some code and it will run this code every second).
      - Inside setInterval, display the current time on the website using root.render(...); (setInterval will run this code every second and this will create a clock).
      Current time: 21:51:38
      */
      const root = ReactDOM.createRoot(container);
      setInterval(() => {
        const currTime = dayjs().format("HH:mm:ss");
        const currTimeElem = <p>Current time: {currTime}</p>;
        root.render(currTimeElem);
      }, 1000);
    </script>
  </body>
</html>
