<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 3</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      // 3g. Start from an empty React website and create an <input> and a <p>. As you type in the <input>, the text you type should also appear in the <p> with "Hello" in front of it. (Hint: use onChange, save the text in state, and insert it in the JSX).
      /* ... 3h. Add 2 buttons inside the <input>, "Reset" and "Example".
      - When clicking the Reset button, it removes the text in the <input>
      - When clicking the Example button, it sets an example text in the <input>, like "Alice" (or any name you want).
      - Hint: use a controlled input.
      */
      function Display({ textDisplay }) {
        return <p>Hello {textDisplay}</p>;
      }

      function Input({ textDisplay, setTextDisplay }) {
        function updateText(event) {
          setTextDisplay(event.target.value);
        }
        function clearText() {
          setTextDisplay("");
        }
        function showExample() {
          setTextDisplay("Alejandro");
        }
        return (
          <>
            <input type="text" onChange={updateText} value={textDisplay} />
            <button onClick={clearText}>Reset</button>
            <button onClick={showExample}>Example</button>
          </>
        );
      }

      function App() {
        const [textDisplay, setTextDisplay] = React.useState("");
        return (
          <>
            <Input textDisplay={textDisplay} setTextDisplay={setTextDisplay} />
            <Display textDisplay={textDisplay} />
          </>
        );
      }

      root.render(<App />);

      // Next exercise challenges are within "3-chatbot.html"
    </script>
  </body>
</html>
