<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 2</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      // --- CHALLENGE EXERCISES --- //
      // 2e. Let's say we're creating an e-commerce app, and one of the products is socks. Create an <App> component and display the details on the right onto the website

      // ... 2f. Display 2 more products on the website: tennis balls and a t-shirt. Instead of duplicating the code, create a <ProductDetails> component, and use props to make it reusable. Then, display 3 <ProductDetails> on the website for the socks, tennis balls, and t-shirt.

      /* ... 2g. Continuing from 2f, some products can have a discount. Add a prop to <ProductDetails> called discountPrice. If discountPrice exists, display it under the original price.
        - Give the socks product a discount price of $5.45
      */

      /* ... 2h. If a product has a discountPrice also cross out the original price.
      - To cross out text, surround it with the element: <del>...</del>
      - Don't cross out the original price if there's no discount. To check if discountPrice does not exist, use !discountPrice
      - There are several ways to do this exercise. As long as you get the final result, you're good!
       */

      /* ... 2i. JavaScript has a feature called the ternary operator:
        `const result = value1 ? value2 : value3;`
        If value1 is true, then the result is value2. Else, the result is value3.
        - This lets us insert an if-else statement directly in the JSX.
        - Update the previous exercise to use a ternary operator in the JSX.
      */

      /* 2j. We'll add an image at the top of each Product. In your browser, go to supersimple.dev/images/_ (replace with cotton-socks.png, tennis-balls.png, and plain-t-shirt.png). Download the images.
      - In <ProductDetails> add an <img> at the top, and add a prop called imageSrc. Give the <img> the attribute src={imageSrc} (this sets the src attribute to the value of the imageSrc prop). 
      - Then in <App>, give each <ProductDetails> a prop imageSrc="_"(replace _ with the file name of the image, like cotton-socks.png)
      */
      function ProductDetails({ name, price, discountPrice, imageSrc }) {
        return (
          <div>
            <img src={imageSrc} width="60" />
            <p>{name}</p>
            {discountPrice ? (
              <del>Price: ${price}</del>
            ) : (
              <p>Price: ${price}</p>
            )}
            {discountPrice && <p>Discount price: ${discountPrice}</p>}
            <button>Add to Cart</button>
          </div>
        );
      }

      function App() {
        return (
          <>
            <ProductDetails
              name="Cotton socks"
              price="10.90"
              discountPrice="5.45"
              imageSrc="assets/images/cotton-socks.png"
            />
            <ProductDetails
              name="Tennis balls"
              price="6.00"
              imageSrc="assets/images/tennis-balls.png"
            />
            <ProductDetails
              name="Plain T-Shirt"
              price="7.99"
              imageSrc="assets/images/plain-t-shirt.png"
            />
          </>
        );
      }
      root.render(<App />);
    </script>
  </body>
</html>
